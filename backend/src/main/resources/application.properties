spring.application.name=miniCRM

# Datasource MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mini_crm_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:miniCrmUser}
spring.datasource.password=${DB_PASSWORD:crm123P@}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG

spring.web.error.include-stacktrace=never

# Job de notificacoes (segundos). A varredura ja roda ao iniciar; a agendada comeca depois do atraso
# inicial e se repete a cada intervalo, contado a partir do fim da execucao anterior.
notificacao.job.inicio-segundos-verificacao=30
notificacao.job.intervalo-segundos-verificacao=300

SEED_ADMIN_EMAIL=teste@email.com
SEED_ADMIN_SENHA=123

# JWT HS256 exige no minimo 32 caracteres.
JWT_SECRET=chave-de-desenvolvimento-do-minicrm-trocar-em-producao-2026
